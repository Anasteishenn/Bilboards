<svg xmlns="http://www.w3.org/2000/svg" width="920" height="780" viewBox="0 0 920 780" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <!-- Диаграмма прецедентов AdBoard Core. Исходник: docs/use-case.puml -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#333" stroke-width="1.5"/>
    </marker>
    <marker id="gen" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#fff" stroke="#333" stroke-width="1.2"/>
    </marker>
    <style>
      .actor { fill: none; stroke: #333; stroke-width: 1.6; }
      .uc { fill: #f3f3f3; stroke: #555; stroke-width: 1.2; }
      .inc { fill: #fff8e6; stroke: #b08a2e; stroke-width: 1.2; }
      .assoc { stroke: #333; stroke-width: 1.2; fill: none; }
      .dash { stroke: #8a6a1c; stroke-width: 1.2; stroke-dasharray: 6 4; fill: none; }
      .label { fill: #111; text-anchor: middle; }
      .small { font-size: 11px; fill: #8a6a1c; text-anchor: middle; }
      .group { font-size: 12px; fill: #888; }
    </style>
  </defs>

  <rect width="920" height="780" fill="#ffffff"/>

  <!-- Граница системы -->
  <rect x="260" y="20" width="640" height="745" fill="none" stroke="#333" stroke-width="1.4"/>
  <text x="580" y="42" class="label" font-weight="bold" font-size="15">AdBoard Core</text>

  <!-- Актёры -->
  <g class="actor">
    <circle cx="60" cy="60" r="10"/><line x1="60" y1="70" x2="60" y2="100"/><line x1="45" y1="80" x2="75" y2="80"/>
    <line x1="60" y1="100" x2="48" y2="125"/><line x1="60" y1="100" x2="72" y2="125"/>

    <circle cx="150" cy="230" r="10"/><line x1="150" y1="240" x2="150" y2="270"/><line x1="135" y1="250" x2="165" y2="250"/>
    <line x1="150" y1="270" x2="138" y2="295"/><line x1="150" y1="270" x2="162" y2="295"/>

    <circle cx="150" cy="450" r="10"/><line x1="150" y1="460" x2="150" y2="490"/><line x1="135" y1="470" x2="165" y2="470"/>
    <line x1="150" y1="490" x2="138" y2="515"/><line x1="150" y1="490" x2="162" y2="515"/>

    <circle cx="150" cy="645" r="10"/><line x1="150" y1="655" x2="150" y2="685"/><line x1="135" y1="665" x2="165" y2="665"/>
    <line x1="150" y1="685" x2="138" y2="710"/><line x1="150" y1="685" x2="162" y2="710"/>
  </g>
  <text x="60" y="145" class="label">Гость</text>
  <text x="150" y="315" class="label">Клиент</text>
  <text x="150" y="535" class="label">Менеджер</text>
  <text x="150" y="730" class="label">Администратор</text>

  <!-- Обобщение актёров: Клиент и Менеджер — частные случаи Гостя, Администратор — Менеджера -->
  <line x1="145" y1="218" x2="70" y2="152" class="assoc" marker-end="url(#gen)"/>
  <line x1="138" y1="438" x2="58" y2="153" class="assoc" marker-end="url(#gen)"/>
  <line x1="150" y1="633" x2="150" y2="543" class="assoc" marker-end="url(#gen)"/>

  <!-- Прецеденты -->
  <text x="275" y="62" class="group">Гость</text>
  <ellipse cx="500" cy="70" rx="150" ry="20" class="uc"/><text x="500" y="75" class="label">Регистрация аккаунта</text>
  <ellipse cx="500" cy="118" rx="150" ry="20" class="uc"/><text x="500" y="123" class="label">Авторизация в системе</text>

  <text x="275" y="172" class="group">Клиент</text>
  <ellipse cx="500" cy="190" rx="150" ry="20" class="uc"/><text x="500" y="195" class="label">Просмотр каталога щитов</text>
  <ellipse cx="500" cy="240" rx="150" ry="20" class="uc"/><text x="500" y="245" class="label">Фильтрация по району, типу и цене</text>
  <ellipse cx="500" cy="290" rx="150" ry="20" class="uc"/><text x="500" y="295" class="label">Оформление заявки на аренду</text>
  <ellipse cx="500" cy="340" rx="150" ry="20" class="uc"/><text x="500" y="345" class="label">Просмотр своих заявок</text>

  <text x="275" y="392" class="group">Менеджер</text>
  <ellipse cx="500" cy="410" rx="150" ry="20" class="uc"/><text x="500" y="415" class="label">Просмотр заявок Pending</text>
  <ellipse cx="500" cy="460" rx="150" ry="20" class="uc"/><text x="500" y="465" class="label">Одобрение / отклонение заявки</text>
  <ellipse cx="500" cy="510" rx="150" ry="20" class="uc"/><text x="500" y="515" class="label">Отчёт по занятости и выручке</text>
  <ellipse cx="500" cy="560" rx="150" ry="20" class="uc"/><text x="500" y="565" class="label">Просмотр всех заявок</text>

  <text x="275" y="612" class="group">Администратор</text>
  <ellipse cx="500" cy="630" rx="150" ry="20" class="uc"/><text x="500" y="635" class="label">Добавление конструкции</text>
  <ellipse cx="500" cy="680" rx="150" ry="20" class="uc"/><text x="500" y="685" class="label">Редактирование конструкции</text>
  <ellipse cx="500" cy="730" rx="150" ry="20" class="uc"/><text x="500" y="735" class="label">Списание конструкции</text>

  <!-- Включаемые прецеденты -->
  <ellipse cx="795" cy="250" rx="90" ry="28" class="inc"/>
  <text x="795" y="246" class="label">Расчёт стоимости</text>
  <text x="795" y="263" class="label" font-size="12">(скидки, Strategy)</text>
  <ellipse cx="795" cy="410" rx="90" ry="28" class="inc"/>
  <text x="795" y="406" class="label">Проверка занятости</text>
  <text x="795" y="423" class="label" font-size="12">дат щита</text>

  <!-- Ассоциации актёров с прецедентами -->
  <line x1="78" y1="80" x2="350" y2="70" class="assoc" marker-end="url(#arrow)"/>
  <line x1="78" y1="84" x2="350" y2="118" class="assoc" marker-end="url(#arrow)"/>

  <line x1="168" y1="250" x2="350" y2="190" class="assoc" marker-end="url(#arrow)"/>
  <line x1="168" y1="250" x2="350" y2="240" class="assoc" marker-end="url(#arrow)"/>
  <line x1="168" y1="252" x2="350" y2="290" class="assoc" marker-end="url(#arrow)"/>
  <line x1="168" y1="254" x2="350" y2="340" class="assoc" marker-end="url(#arrow)"/>

  <line x1="168" y1="470" x2="350" y2="410" class="assoc" marker-end="url(#arrow)"/>
  <line x1="168" y1="470" x2="350" y2="460" class="assoc" marker-end="url(#arrow)"/>
  <line x1="168" y1="472" x2="350" y2="510" class="assoc" marker-end="url(#arrow)"/>
  <line x1="168" y1="474" x2="350" y2="560" class="assoc" marker-end="url(#arrow)"/>

  <line x1="168" y1="665" x2="350" y2="630" class="assoc" marker-end="url(#arrow)"/>
  <line x1="168" y1="665" x2="350" y2="680" class="assoc" marker-end="url(#arrow)"/>
  <line x1="168" y1="667" x2="350" y2="730" class="assoc" marker-end="url(#arrow)"/>

  <!-- «include» -->
  <line x1="650" y1="286" x2="707" y2="262" class="dash" marker-end="url(#arrow)"/>
  <text x="672" y="266" class="small">«include»</text>
  <line x1="640" y1="300" x2="728" y2="390" class="dash" marker-end="url(#arrow)"/>
  <text x="712" y="342" class="small">«include»</text>
  <line x1="650" y1="456" x2="710" y2="420" class="dash" marker-end="url(#arrow)"/>
  <text x="700" y="458" class="small">«include»</text>
</svg>
